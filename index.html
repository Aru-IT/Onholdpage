<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Request on hold</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #E8E8E8; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { background: #fff; border-radius: 24px; padding: 48px 32px; max-width: 420px; width: 100%; text-align: center; box-sizing: border-box; }
  .icon { width: 64px; height: 64px; line-height: 64px; border-radius: 50%; margin: 0 auto 20px; color: #fff; font-size: 30px; font-weight: 700; background: #000; }
  h1 { margin: 0 0 10px; font-family: Georgia, 'Times New Roman', serif; font-size: 28px; line-height: 34px; color: #000; }
  p { margin: 0; font-size: 16px; line-height: 24px; color: #555; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">&hellip;</div>
    <h1 id="title">Processing...</h1>
    <p id="text">Please wait.</p>
  </div>
  <script>
    // Yahan apni NAYI regenerate ki hui key daalein
    var API_KEY = "1003.0c11acd8f0158ea963600824118d9d7c.a6a228e5b8623b98f47b4b466bde299f";

    var recId = new URLSearchParams(location.search).get('recId');
    var $ = function (id) { return document.getElementById(id); };

    function show(title, text, color, icon, textColor) {
      $('title').textContent = title;
      $('text').textContent = text;
      $('icon').textContent = icon;
      $('icon').style.background = color;
      $('icon').style.color = textColor || '#fff';
    }

    if (!recId) {
      show('Invalid link', 'Record ID missing hai.', '#C62828', '\u2715');
    } else {
      var url = 'https://www.zohoapis.com/crm/v7/functions/onhold/actions/execute'
        + '?auth_type=apikey&zapikey=' + encodeURIComponent(API_KEY)
        + '&recId=' + encodeURIComponent(recId)
        + '&decision=On Hold';

      fetch(url, { mode: 'no-cors' })
        .then(function () {
          show('Request on hold', 'Your decision has been saved. You can close this tab.', '#F5B800', 'II', '#000');
        })
        .catch(function () {
          show('Something went wrong', 'Please try again.', '#C62828', '!');
        });
    }
  </script>
</body>
</html>
